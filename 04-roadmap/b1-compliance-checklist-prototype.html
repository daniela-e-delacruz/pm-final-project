<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B1 One-Click Compliance Checklist · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E8E3;--surface:#F7F8F5;--ink:#15233A;--muted:#5B6672;--line:#C6CBC4;--accent:#F2B705;--pass:#2E7D4F;--fail:#B23A2E;--info:#2F6FB0;--edit:#C27C0E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A21;--surface:#1D252E;--ink:#E9ECE6;--muted:#9AA4AE;--line:#334050;--pass:#4FB37A;--fail:#E06A5C;--info:#5B9BDB;--edit:#E2A23B}}
:root[data-theme="dark"]{--bg:#141A21;--surface:#1D252E;--ink:#E9ECE6;--muted:#9AA4AE;--line:#334050;--pass:#4FB37A;--fail:#E06A5C;--info:#5B9BDB;--edit:#E2A23B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1rem 3rem}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:.6rem;margin-bottom:1.25rem}
.bar strong{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem}
.bar span{color:var(--muted)}
h1{font-family:"Barlow Condensed",sans-serif;font-size:2rem;line-height:1.1;margin:0 0 .25rem}
.sub{color:var(--muted);margin:0 0 1.25rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem}
.route{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.route h2{margin:0;font-size:1.1rem}
.route p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--surface);border:none;border-radius:6px;padding:.55rem 1rem;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:#15233A}
.btn:focus-visible,.toggle:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.checked{color:var(--pass);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
label.f{display:block;font-size:.88rem;color:var(--muted);font-weight:600}
input[type=text]{width:100%;font:inherit;padding:.45rem .6rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);margin-top:.2rem}
input.err{border:2px solid var(--fail)}
.prefill{font-size:.78rem;color:var(--info);font-weight:600;margin-left:.35rem}
.edited{font-size:.78rem;color:var(--edit);font-weight:700;margin-left:.35rem}
.missing{font-size:.78rem;color:var(--fail);font-weight:700;margin-left:.35rem}
h3{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;margin:0 0 .6rem}
.item{padding:.65rem 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.itemrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.toggles{display:flex;gap:.4rem}
.toggle{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;padding:.3rem .8rem;font-weight:600}
.toggle.on.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.toggle.on.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.toggle.err{border-color:var(--fail)}
.msg{color:var(--fail);font-size:.88rem;font-weight:600;margin-top:.3rem}
.ent-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.link{background:none;border:none;color:var(--info);font-weight:600;padding:0}
.review dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:0}
.review dt{color:var(--muted)}
.review dd{margin:0;font-weight:600}
.actions{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
.summary{background:var(--fail);color:#fff;border-radius:6px;padding:.6rem .9rem;font-weight:600;margin-bottom:1rem}
.warn{border:2px solid var(--edit);border-radius:8px;padding:1rem;background:var(--surface);margin-bottom:1rem}
.warn p{margin:0 0 .75rem;font-weight:600}
.done{text-align:center;padding:2rem 1rem}
.done .big{font-family:"Barlow Condensed",sans-serif;font-size:2.4rem;line-height:1.05;margin:.5rem 0}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.note{color:var(--muted);font-size:.85rem;margin-top:2rem}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const TODAY = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const ITEMS = [
  "Driver license valid for this vehicle",
  "Hours of service within the legal limit",
  "Brakes and lights inspected",
  "Cargo secured and within weight limit",
  "Shipping documents on board",
  "Fire extinguisher and safety kit on board"
];
const ENTERPRISE = [
  {key:"jurisdiction", label:"Regulatory jurisdiction"},
  {key:"accountCode", label:"Account compliance code"},
  {key:"inspectorId", label:"Inspector ID"},
  {key:"auditNote", label:"Note for audit"}
];
const INITIAL_ROUTES = [
  {id:"R-101", name:"North Loop", account:"Harbor Freight Co.", driver:"Luis Romero", vehicle:"Truck 14", requiredEnterprise:null, checked:null},
  {id:"R-102", name:"Airport Run", account:"Delta Parts Inc.", driver:"Ana Torres", vehicle:"", requiredEnterprise:"accountCode", checked:null},
  {id:"R-103", name:"Downtown Express", account:"Harbor Freight Co.", driver:"Mike Chen", vehicle:"Van 3", requiredEnterprise:null,
   checked:{time:"7:42 AM", fields:{driver:"Mike Chen",vehicle:"Van 3",route:"R-103 Downtown Express",date:TODAY}, results:ITEMS.map(()=>"pass"), reasons:{}, enterprise:{}}}
];

function fmt(s){const m=Math.floor(s/60),r=s%60;return `${m}:${String(r).padStart(2,"0")}`}

function App(){
  const [routes,setRoutes]=useState(INITIAL_ROUTES);
  const [screen,setScreen]=useState("home");
  const [active,setActive]=useState(null);
  const [lastSaved,setLastSaved]=useState(null);

  function openRoute(r){setActive(r);setScreen(r.checked?"view":"core")}
  function submitted(record){
    setRoutes(rs=>rs.map(r=>r.id===active.id?{...r,checked:record}:r));
    setLastSaved({route:active,record});setScreen("done");
  }

  return (
    <div className="app">
      <div className="bar"><strong>RouteLogic</strong><span>Shift view · {TODAY}, 6:00 AM to 2:00 PM</span></div>
      {screen==="home" && <Home routes={routes} onOpen={openRoute}/>}
      {screen==="core" && <Core route={active} onCancel={()=>setScreen("home")} onSubmit={submitted}/>}
      {screen==="view" && <ViewOnly route={routes.find(r=>r.id===active.id)} onBack={()=>setScreen("home")}/>}
      {screen==="done" && <Done saved={lastSaved} onBack={()=>setScreen("home")}/>}
      <p className="note">Prototype with mock data. Nothing is saved after you close this page.</p>
    </div>
  );
}

function Home({routes,onOpen}){
  return (<div>
    <h1>Today's routes</h1>
    <p className="sub">Log the compliance check for each active route.</p>
    {routes.map(r=>(
      <div className="panel route" key={r.id}>
        <div>
          <h2>{r.id} {r.name}</h2>
          <p>{r.account} · Driver: {r.driver} · Vehicle: {r.vehicle||"not assigned"}</p>
        </div>
        {r.checked
          ? <div style={{display:"flex",gap:".75rem",alignItems:"center"}}><span className="checked">✓ Checked at {r.checked.time}</span><button className="btn ghost" onClick={()=>onOpen(r)}>View check</button></div>
          : <button className="btn primary" onClick={()=>onOpen(r)}>Log compliance check</button>}
      </div>
    ))}
  </div>);
}

function Core({route,onCancel,onSubmit}){
  const prefill={driver:route.driver,vehicle:route.vehicle,route:`${route.id} ${route.name}`,date:TODAY};
  const [fields,setFields]=useState(prefill);
  const [results,setResults]=useState(ITEMS.map(()=>null));
  const [reasons,setReasons]=useState({});
  const [entOpen,setEntOpen]=useState(!!route.requiredEnterprise);
  const [ent,setEnt]=useState({});
  const [tried,setTried]=useState(false);
  const [leaving,setLeaving]=useState(false);
  const [secs,setSecs]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setSecs(s=>s+1),1000);return()=>clearInterval(t)},[]);

  const labels={driver:"Driver",vehicle:"Vehicle",route:"Route",date:"Date"};
  const isEdited=k=>prefill[k]!=="" && fields[k]!==prefill[k];
  const isMissingPrefill=k=>prefill[k]==="";

  const problems=[];
  Object.keys(fields).forEach(k=>{if(!fields[k].trim())problems.push({type:"field",k})});
  results.forEach((v,i)=>{if(v===null)problems.push({type:"item",i})});
  results.forEach((v,i)=>{if(v==="fail"&&!(reasons[i]||"").trim())problems.push({type:"reason",i})});
  if(route.requiredEnterprise&&!(ent[route.requiredEnterprise]||"").trim())problems.push({type:"ent"});
  const has=(type,x)=>tried&&problems.some(p=>p.type===type&&(p.k===x||p.i===x||x===undefined));

  function submit(){
    setTried(true);
    if(problems.length){if(problems.some(p=>p.type==="ent"))setEntOpen(true);return}
    const time=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    onSubmit({time,fields,results,reasons,enterprise:ent,seconds:secs});
  }
  function setResult(i,v){setResults(r=>r.map((x,j)=>j===i?v:x))}

  return (<div>
    {leaving && <div className="warn" role="alertdialog" aria-label="Unsaved check">
      <p>This check isn't saved yet. If you leave now, you'll need to start it again.</p>
      <div style={{display:"flex",gap:".6rem",flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>setLeaving(false)}>Keep logging</button>
        <button className="btn ghost" onClick={onCancel}>Leave without saving</button>
      </div>
    </div>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"1rem",flexWrap:"wrap"}}>
      <h1>Compliance check · {route.id}</h1>
      <span className="timer" aria-live="off">Time on this check {fmt(secs)}</span>
    </div>
    <p className="sub">{route.account.replace(/\.$/,"")}. Review what's pre-filled, mark each item and submit.</p>

    {tried && problems.length>0 && <div className="summary" role="alert">{problems.length} {problems.length===1?"thing is":"things are"} missing. Check the highlighted fields below.</div>}

    <div className="panel">
      <h3>Shift details</h3>
      <div className="grid">
        {Object.keys(fields).map(k=>(
          <div key={k}>
            <label className="f" htmlFor={"f-"+k}>{labels[k]}
              {isMissingPrefill(k)?<span className="missing">No data, please complete</span>:isEdited(k)?<span className="edited">Edited</span>:<span className="prefill">Pre-filled</span>}
            </label>
            <input id={"f-"+k} type="text" className={has("field",k)?"err":""} value={fields[k]} onChange={e=>setFields({...fields,[k]:e.target.value})}/>
            {has("field",k)&&<div className="msg">Add the {labels[k].toLowerCase()} to continue.</div>}
          </div>
        ))}
      </div>
    </div>

    <div className="panel">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"1rem",flexWrap:"wrap"}}>
        <h3>Checklist</h3>
        <span className="sub" style={{margin:0}} aria-live="polite">{results.filter(r=>r!==null).length} of {ITEMS.length} items marked</span>
      </div>
      <div role="progressbar" aria-label="Checklist progress" aria-valuemin={0} aria-valuemax={ITEMS.length} aria-valuenow={results.filter(r=>r!==null).length} style={{height:"6px",borderRadius:"999px",background:"rgba(127,127,127,.25)",margin:"0 0 .9rem",overflow:"hidden"}}>
        <div style={{height:"100%",width:(results.filter(r=>r!==null).length/ITEMS.length*100)+"%",background:"currentColor",opacity:.7,transition:"width .2s"}}></div>
      </div>
      {ITEMS.map((txt,i)=>(
        <div className="item" key={i}>
          <div className="itemrow">
            <span>{txt}</span>
            <div className="toggles" role="group" aria-label={txt}>
              <button className={"toggle pass"+(results[i]==="pass"?" on":"")+(has("item",i)?" err":"")} aria-pressed={results[i]==="pass"} onClick={()=>setResult(i,"pass")}>Pass</button>
              <button className={"toggle fail"+(results[i]==="fail"?" on":"")+(has("item",i)?" err":"")} aria-pressed={results[i]==="fail"} onClick={()=>setResult(i,"fail")}>Fail</button>
            </div>
          </div>
          {has("item",i)&&<div className="msg">Mark this item as pass or fail.</div>}
          {results[i]==="fail"&&<div style={{marginTop:".5rem"}}>
            <label className="f" htmlFor={"r-"+i}>Reason for failing (required)</label>
            <input id={"r-"+i} type="text" className={has("reason",i)?"err":""} value={reasons[i]||""} onChange={e=>setReasons({...reasons,[i]:e.target.value})}/>
            {has("reason",i)&&<div className="msg">Add a reason before submitting.</div>}
          </div>}
        </div>
      ))}
    </div>

    <div className="panel">
      <div className="ent-head">
        <h3 style={{margin:0}}>Advanced enterprise fields</h3>
        <button className="link" aria-expanded={entOpen} onClick={()=>setEntOpen(!entOpen)}>{entOpen?"Hide":"Show"} {ENTERPRISE.length} fields</button>
      </div>
      {route.requiredEnterprise&&<p className="msg" style={{color:"var(--edit)"}}>This account requires the {ENTERPRISE.find(e=>e.key===route.requiredEnterprise).label.toLowerCase()}.</p>}
      {entOpen&&<div className="grid" style={{marginTop:".75rem"}}>
        {ENTERPRISE.map(e=>{const req=route.requiredEnterprise===e.key;return(
          <div key={e.key}>
            <label className="f" htmlFor={"e-"+e.key}>{e.label}{req?" (required)":" (optional)"}</label>
            <input id={"e-"+e.key} type="text" className={req&&has("ent")?"err":""} value={ent[e.key]||""} onChange={ev=>setEnt({...ent,[e.key]:ev.target.value})}/>
            {req&&has("ent")&&<div className="msg">This account needs this field before submitting.</div>}
          </div>)})}
      </div>}
    </div>

    <div className="panel review">
      <h3>Review before submitting</h3>
      <dl>
        {Object.keys(fields).map(k=><React.Fragment key={k}><dt>{labels[k]}</dt><dd>{fields[k]||"—"}{isEdited(k)&&<span className="edited">Edited</span>}</dd></React.Fragment>)}
        <dt>Items passed</dt><dd>{results.filter(r=>r==="pass").length} of {ITEMS.length}</dd>
        <dt>Items failed</dt><dd>{results.filter(r=>r==="fail").length}</dd>
      </dl>
    </div>

    <div className="actions">
      <button className="btn ghost" onClick={()=>setLeaving(true)}>Back to shift view</button>
      <button className="btn primary" onClick={submit}>Confirm and submit check</button>
    </div>
  </div>);
}

function ViewOnly({route,onBack}){
  const c=route.checked;
  return (<div>
    <h1>{route.id} {route.name}</h1>
    <p className="sub"><span className="checked">✓ Checked at {c.time}</span>. This check is view only.</p>
    <div className="panel review"><dl>
      <dt>Driver</dt><dd>{c.fields.driver}</dd><dt>Vehicle</dt><dd>{c.fields.vehicle}</dd>
      <dt>Route</dt><dd>{c.fields.route}</dd><dt>Date</dt><dd>{c.fields.date}</dd>
    </dl></div>
    <div className="panel">
      {ITEMS.map((t,i)=><div className="item itemrow" key={i}><span>{t}</span><strong style={{color:c.results[i]==="pass"?"var(--pass)":"var(--fail)"}}>{c.results[i]==="pass"?"Pass":"Fail"}{c.reasons[i]?`: ${c.reasons[i]}`:""}</strong></div>)}
    </div>
    <button className="btn ghost" onClick={onBack}>Back to shift view</button>
  </div>);
}

function Done({saved,onBack}){
  const {route,record}=saved;
  const fails=record.results.filter(r=>r==="fail").length;
  return (<div className="panel done">
    <span className="checked" style={{fontSize:"2rem"}}>✓</span>
    <p className="big">Compliance check saved</p>
    <p>{route.id} {route.name} was saved at {record.time} and is already in the compliance record your managers use.</p>
    <p className="sub">{ITEMS.length-fails} items passed, {fails} failed · completed in {fmt(record.seconds)}</p>
    <button className="btn" onClick={onBack}>Back to shift view</button>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
